<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fons circular per destacar, similar a l'anterior -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    
    <!-- Gradient per al símbol de l'element -->
    <linearGradient id="elementGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    
    <!-- Efecte de resplendor per al símbol -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fons base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Estructura simplificada d'un bloc d'element (ex: Hidrogen 'H') -->
  <g filter="url(#glow)">
    <!-- Rectangle de fons del bloc -->
    <rect x="128" y="128" width="256" height="256" rx="40" fill="#f8fafc" stroke="#38bdf8" stroke-width="12"/>
    
    <!-- Nombre atòmic simplification: '1' -->
    <text x="160" y="192" font-family="Arial, sans-serif" font-size="40" fill="#38bdf8" font-weight="bold">1</text>
    
    <!-- Símbol de l'element simplification: 'H' -->
    <text x="256" y="288" font-family="Arial, sans-serif" font-size="120" fill="url(#elementGrad)" text-anchor="middle" font-weight="bold">H</text>
    
    <!-- Nombre màssic simplification: '1.008' -->
    <text x="256" y="360" font-family="Arial, sans-serif" font-size="28" fill="#c084fc" text-anchor="middle" font-weight="bold">1.008</text>
  </g>
</svg>
